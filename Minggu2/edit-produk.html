<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Produk - Admin Template</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col text-slate-800">

  <header class="bg-gradient-to-r from-indigo-700 to-violet-600 text-white shadow-lg">
    <div class="flex items-center justify-between px-6 py-4">
      <div>
        <p class="text-xs uppercase tracking-[0.25em] text-indigo-100">Control Panel</p>
        <h1 class="text-xl font-bold">Admin Panel</h1>
      </div>
      <span class="rounded-full bg-white/10 px-3 py-1 text-sm font-medium backdrop-blur-sm">Halo, Admin</span>
    </div>
  </header>

  <div class="flex flex-1">
    <nav class="w-64 bg-slate-900 text-slate-200 p-4 flex flex-col gap-2">
      <a href="dashboard.html" class="rounded-xl px-3 py-2.5 font-medium transition hover:bg-indigo-700 hover:text-white">Dashboard</a>
      <a href="products.html" class="rounded-xl bg-indigo-700 px-3 py-2.5 font-medium text-white">Products</a>
      <a href="#" class="rounded-xl px-3 py-2.5 font-medium transition hover:bg-indigo-700 hover:text-white">Users</a>
      <a href="#" class="rounded-xl px-3 py-2.5 font-medium transition hover:bg-indigo-700 hover:text-white">Setting</a>
      <a href="index.html" class="mt-auto rounded-xl bg-red-600 px-3 py-2.5 text-center font-medium text-white transition hover:bg-red-700">Logout</a>
    </nav>

    <main class="flex-1 p-6">
      <div class="mb-6">
        <p class="text-xs font-semibold uppercase tracking-[0.25em] text-indigo-500">Catalog</p>
        <h2 class="mt-2 text-3xl font-bold text-slate-800">Edit Produk</h2>
      </div>

      <form action="products.html" class="max-w-2xl rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <div class="grid gap-5 md:grid-cols-2">
          <div class="md:col-span-2">
            <label class="mb-2 block text-sm font-medium text-slate-700">Name</label>
            <input type="text" name="name" value="Kaos Polos Hitam"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-slate-800 focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-100">
          </div>

          <div class="md:col-span-2">
            <label class="mb-2 block text-sm font-medium text-slate-700">Stock</label>
            <input type="number" name="stock" value="120"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-slate-800 focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-100">
          </div>

          <div class="md:col-span-2">
            <label class="mb-2 block text-sm font-medium text-slate-700">Description</label>
            <textarea name="description" rows="4"
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-slate-800 focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-100">Kaos polos warna hitam bahan cotton combed 30s.</textarea>
          </div>
        </div>

        <div class="mt-6 flex justify-end">
          <button type="submit"
            class="rounded-xl bg-indigo-700 px-5 py-3 font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:bg-indigo-800">
            Submit
          </button>
        </div>
      </form>
    </main>
  </div>

  <footer class="bg-slate-900 py-3 text-center text-sm text-slate-300">
    &copy; 2026 Admin Template. All rights reserved.
  </footer>

</body>
</html>
