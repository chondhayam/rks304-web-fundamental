<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Admin Template</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-900 via-violet-900 to-slate-900 flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-md">
    <div class="mb-6 text-center">
      <div class="inline-flex h-14 w-14 items-center justify-center rounded-full bg-white/10 backdrop-blur-sm border border-white/20 text-2xl shadow-lg">
        🔐
      </div>
    </div>

    <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl border border-white/20 p-8">
      <div class="mb-6 text-center">
        <p class="text-xs font-semibold uppercase tracking-[0.3em] text-indigo-500">Admin Portal</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-800">Login</h1>
      </div>

      <form action="dashboard.html" class="space-y-5">
        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700">Username</label>
          <input type="text" name="username" placeholder="Masukkan username"
            class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-slate-800 placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-100">
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700">Password</label>
          <input type="password" name="password" placeholder="Masukkan password"
            class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-slate-800 placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-100">
        </div>

        <div class="flex items-center justify-between text-sm text-slate-500">
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
            Ingat saya
          </label>
          <a href="#" class="text-indigo-600 hover:text-indigo-700">Lupa password?</a>
        </div>

        <button type="submit"
          class="w-full rounded-xl bg-gradient-to-r from-indigo-700 to-violet-600 px-4 py-3 font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:from-indigo-800 hover:to-violet-700">
          Login
        </button>
      </form>
    </div>
  </div>

</body>
</html>
