<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-[#f5f3e9] via-[#eef4ef] to-[#e5ede7] p-4 text-slate-800">
  <main class="w-full max-w-xl rounded-2xl border border-white/80 bg-white p-7 shadow-[0_20px_60px_-30px_rgba(15,45,35,0.35)] sm:p-10">
    <p class="mb-5 inline-flex items-center gap-2 rounded-full border border-emerald-900/10 bg-emerald-50 px-3 py-1 text-xs font-semibold uppercase text-emerald-900">
      <span class="h-2 w-2 rounded-full bg-amber-500"></span>
      Akun terdaftar
    </p>
    <h1 class="text-3xl font-bold text-slate-900 sm:text-4xl">Selamat datang!</h1>
    <p class="mt-3 text-slate-600">Registrasi berhasil. Kamu sudah bisa melanjutkan.</p>
    <a href="register.html"
      class="mt-8 inline-flex items-center justify-center rounded-lg bg-emerald-900 px-5 py-3 font-semibold text-white transition hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-700/20">
      Kembali ke Register
    </a>
  </main>
</body>
</html>
