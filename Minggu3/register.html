<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#f5f3e9] via-[#eef4ef] to-[#e5ede7] px-4 py-10 text-slate-800 sm:py-14">

  <main class="mx-auto w-full max-w-2xl">
    <header class="mb-6 sm:mb-8">
      <p class="mb-3 inline-flex items-center gap-2 rounded-full border border-emerald-900/10 bg-white/70 px-3 py-1 text-xs font-semibold uppercase text-emerald-900">
        <span class="h-2 w-2 rounded-full bg-amber-500"></span>
        Pendaftaran akun
      </p>
      <h1 class="text-3xl font-bold text-slate-900 sm:text-4xl">Buat akun baru</h1>
      <p class="mt-2 text-sm text-slate-600 sm:text-base">Lengkapi data diri untuk melanjutkan.</p>
    </header>

    <section class="rounded-2xl border border-white/80 bg-white p-5 shadow-[0_20px_60px_-30px_rgba(15,45,35,0.35)] sm:p-8">
    <form id="registerForm" action="dashboard.html" method="get" novalidate class="grid gap-4 sm:grid-cols-2 sm:gap-x-5 sm:gap-y-5">

      <div>
        <label for="username" class="mb-1.5 block text-sm font-semibold text-slate-700">Username</label>
        <input type="text" id="username" name="username" placeholder="minimal 3 karakter"
          autocomplete="username" class="w-full rounded-lg border border-slate-300 bg-slate-50/60 px-3.5 py-2.5 text-sm transition placeholder:text-slate-400 focus:border-emerald-700 focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-700/10">
        <p id="usernameError" class="hidden text-xs text-red-600 mt-1"></p>
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-semibold text-slate-700">Password</label>
        <input type="password" id="password" name="password" placeholder="minimal 8 karakter"
          autocomplete="new-password" class="w-full rounded-lg border border-slate-300 bg-slate-50/60 px-3.5 py-2.5 text-sm transition placeholder:text-slate-400 focus:border-emerald-700 focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-700/10">
        <p id="passwordError" class="hidden text-xs text-red-600 mt-1"></p>
      </div>

      <div>
        <label for="nama" class="mb-1.5 block text-sm font-semibold text-slate-700">Nama</label>
        <input type="text" id="nama" name="nama" placeholder="nama lengkap"
          autocomplete="name" class="w-full rounded-lg border border-slate-300 bg-slate-50/60 px-3.5 py-2.5 text-sm transition placeholder:text-slate-400 focus:border-emerald-700 focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-700/10">
        <p id="namaError" class="hidden text-xs text-red-600 mt-1"></p>
      </div>

      <div>
        <label for="tanggalLahir" class="mb-1.5 block text-sm font-semibold text-slate-700">Tanggal Lahir</label>
        <input type="date" id="tanggalLahir" name="tanggalLahir"
          class="w-full rounded-lg border border-slate-300 bg-slate-50/60 px-3.5 py-2.5 text-sm transition focus:border-emerald-700 focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-700/10">
        <p id="tanggalLahirError" class="hidden text-xs text-red-600 mt-1"></p>
      </div>

      <div class="sm:col-span-2">
        <label for="alamat" class="mb-1.5 block text-sm font-semibold text-slate-700">Alamat</label>
        <textarea id="alamat" name="alamat" rows="3" placeholder="alamat lengkap"
          autocomplete="street-address" class="w-full resize-y rounded-lg border border-slate-300 bg-slate-50/60 px-3.5 py-2.5 text-sm transition placeholder:text-slate-400 focus:border-emerald-700 focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-700/10"></textarea>
        <p id="alamatError" class="hidden text-xs text-red-600 mt-1"></p>
      </div>

      <div>
        <label for="telpon" class="mb-1.5 block text-sm font-semibold text-slate-700">Nomor Telepon</label>
        <input type="tel" id="telpon" name="telpon" placeholder="contoh: 628123456789"
          autocomplete="tel" inputmode="numeric" class="w-full rounded-lg border border-slate-300 bg-slate-50/60 px-3.5 py-2.5 text-sm transition placeholder:text-slate-400 focus:border-emerald-700 focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-700/10">
        <p id="telponError" class="hidden text-xs text-red-600 mt-1"></p>
      </div>

      <button type="submit"
        class="w-full rounded-lg bg-emerald-900 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-700/20 sm:col-span-2">
        Daftar sekarang
      </button>
    </form>
    </section>
  </main>

  <script src="validasi_input.js"></script>
</body>
</html>
